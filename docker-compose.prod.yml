services:
  bot:
    image: ghcr.io/bejasc/bedge-bot:latest
    env_file:
      - /etc/bedge-bot/bedge-bot.env
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - bedge
    logging:
      options:
        max-size: '10m'
        max-file: '3'

  mongo:
    image: mongo:7
    command: ['--quiet']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: unless-stopped
    networks:
      - bedge
    logging:
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  mongo-data:

networks:
  bedge:
