services:
  bot:
    build:
      context: .
    env_file:
      - apps/bot/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/bedge
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bedge

  api:
    build:
      context: .
    working_dir: /app/apps/api
    command: ["node", "dist/main.js"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/bedge
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bedge

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bedge

volumes:
  mongo-data:

networks:
  bedge:
