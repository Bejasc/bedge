name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm test

      - name: Notify Discord on failure
        if: failure() && github.ref == 'refs/heads/master'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOYS }}
          DISCORD_USERNAME: ${{ secrets.DISCORD_WEBHOOK_USERNAME }}
          DISCORD_AVATAR_URL: ${{ secrets.DISCORD_WEBHOOK_AVATAR_URL }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"$DISCORD_USERNAME\",\"avatar_url\":\"$DISCORD_AVATAR_URL\",\"embeds\":[{\"title\":\"❌ bedge-bot CI failed\",\"description\":\"\`${{ github.ref_name }}\` @ \`${GITHUB_SHA:0:7}\` — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",\"color\":15158332}]}"
