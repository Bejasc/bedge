name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  actions: read
  packages: write

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bejasc/bedge-bot:latest
            ghcr.io/bejasc/bedge-bot:${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy compose file to server
        run: |
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml \
            deploy@${{ secrets.VPS_HOST }}:/opt/bedge-bot/docker-compose.yml

      - name: Pull and restart
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VPS_HOST }} "
            set -e
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u bejasc --password-stdin
            cd /opt/bedge-bot
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
          "

      - name: Health check
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.VPS_HOST }} "
            cd /opt/bedge-bot
            if ! docker compose ps bot | grep -qE 'running|Up'; then
              echo 'FAIL: bedge-bot container is not running'
              docker compose logs bot --tail 30
              exit 1
            fi
          "

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEPLOYS }}
        run: |
          STATUS="${{ job.status }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          if [ "$STATUS" = "success" ]; then COLOR=3066993; EMOJI="✅"; else COLOR=15158332; EMOJI="❌"; fi
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$EMOJI bedge-bot deploy $STATUS\",\"description\":\"\`${SHA:0:7}\`\",\"color\":$COLOR}]}"
